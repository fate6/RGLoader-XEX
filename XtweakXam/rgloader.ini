[Filters]

Block_Live_Dns = 0  ;block xbox live servers


[Expansion]

Map_USB_Mass = 1  ;map usb drives to xbox neighborhood

Persistent_Patches = 1 ;enable patch reloading on every xeximageload.

Boot_Animation = 0  ; enable alternate boot animation
Boot_Animation_Movie = Hdd:\bootanim.wmv ;path to new bootanim xex

HUD_Jump_To_XShell = 1 ;Replaces family settings button in HUD with "Return to XShell"

Retail_Profile_Encryption = 0 ; Enables retail profiles on devkit kernel
;*WARNING: This may corrupt live profiles! Do not enable this patch if you have profiles you want to keep clean!


[Config]

;Default_Dashboard = \SystemRoot\dash.xex  ;sets the metro dash as the default dash

;Default_Dashboard = \Device\Flash\xshell.xex  ;sets the devkit launcher as the default dash

;Redirect_Xshell_Start_But = \Device\Harddisk0\Partition1\FSD\fsd.xex  ;redirect start button in xshell

No_Sign_Notice = 0  ;Disables xbox live signin warning when enabled

;Cover_Art_Folder = Hdd:\Filesystems\CoverArt  ;show <titleid>.jpg or .png covers from this folder on My Games tiles (default shown), 0 = off. Needs Persistent_Patches = 1
;Cover_Art_Root = http://download.xbox.com/content/images  ;also load box art for titles without a local cover from here (off by default)

;SysExt_Redirect = Filesystems\sysext  ;use the system extended/aux partition contents (avatars, dash extensions) from this Hdd: folder instead of the real partitions, off by default.
;*NOTE: the folder needs SystemExtPartition and SystemAuxPartition subfolders (copies of the partitions, SystemExtPartition\system.manifest must exist). Lets a dual boot (e.g. stock + RGLoader) keep a different set on each boot

;RGLP_Skip = 3, 18-37  ;debug aid: leave out these .rglp patch blocks (numbered from 0)

;Feature_Lock = 0x7F  ;keep these xam features from being turned off (bit = feature id - 1: 0x04 XMP, 0x40 wireless). Default 0x7F = all (xam default), 0x40 = wireless only (needed for xbGuard, which freezes with XMP on), 0 = off, log = only log
;*NOTE: a changed feature mask takes effect on the next boot
